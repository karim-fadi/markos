<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Markos Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
/* ---------- THEME ---------- */
:root{
  --bg1:#0f1e4a; --bg2:#1b3a8f; --bg3:#2a5bd7;
  --panel:#12224f; --panel2:#1a3070;
  --gold:#ffcc33; --gold2:#ff9a1f; --gold3:#a85f00;
  --blue:#3aa0ff; --blue2:#1b6be0;
  --green:#5bd35b; --green2:#2f9f2f;
  --red:#ff5a5a; --red2:#c62828;
  --purple:#b46bff; --purple2:#7b2fd6;
  --text:#fff; --muted:#9db4e6;
  --border:#0a1436;
  --shadow:0 6px 0 var(--border), 0 12px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Nunito',sans-serif;color:var(--text);
  background:radial-gradient(1200px 600px at 50% -10%,var(--bg3),var(--bg1) 60%);
  background-attachment:fixed;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.06) 1.5px,transparent 1.5px);
  background-size:26px 26px;
  animation:drift 40s linear infinite;
}
@keyframes drift{to{background-position:260px 260px}}
h1,h2,h3,.title{font-family:'Lilita One',cursive;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
img{display:block}

/* ---------- LAYOUT ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{
  position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,rgba(15,30,74,.95),rgba(15,30,74,.6) 80%,transparent);
}
.logo{display:flex;align-items:center;gap:8px}
.logo .crest{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(160deg,var(--gold),var(--gold2));box-shadow:0 4px 0 var(--gold3),0 8px 14px rgba(0,0,0,.4);
  animation:bob 3s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.logo h1{font-size:26px;color:var(--gold);line-height:1}
.logo small{display:block;font-family:'Nunito';font-weight:800;font-size:11px;color:var(--muted);letter-spacing:2px;text-shadow:none}
.mechip{
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 4px 0 var(--border);
}
.mechip .av{width:34px;height:34px;border-radius:10px;overflow:hidden;background:var(--bg3);border:2px solid var(--gold)}
.mechip .av img{width:100%;height:100%;object-fit:cover}
.mechip .nm{font-weight:900;font-size:13px;line-height:1.1}
.mechip .kr{font-weight:900;color:var(--gold);font-size:12px}

main{flex:1;overflow:hidden;position:relative}
.page{
  position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 14px calc(100px + env(safe-area-inset-bottom));
  opacity:0;transform:translateX(40px) scale(.98);pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.2);
}
.page.active{opacity:1;transform:none;pointer-events:auto}
.page-title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.page-title h2{font-size:30px;color:#fff}
.page-title h2 span{color:var(--gold)}
.sub{color:var(--muted);font-weight:800;font-size:13px}

/* ---------- BOTTOM NAV ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#0d1a40,#08122e);border-top:3px solid #24408a;
  display:grid;grid-template-columns:repeat(6,1fr);gap:4px;box-shadow:0 -10px 30px rgba(0,0,0,.5);
}
nav button{
  background:transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-weight:900;font-size:10px;color:var(--muted);transition:.2s;position:relative;
}
nav button .ic{font-size:22px;transition:transform .3s cubic-bezier(.2,1.6,.4,1);filter:grayscale(.6)}
nav button.on{color:var(--gold);background:linear-gradient(180deg,#26449a,#1b3270);box-shadow:0 3px 0 var(--border)}
nav button.on .ic{transform:translateY(-4px) scale(1.25);filter:none}
nav button:active .ic{transform:scale(.85)}

/* ---------- CARDS ---------- */
.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:18px;padding:14px;
  box-shadow:var(--shadow);border:2px solid #2d4da3;position:relative;
  animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;
  font-family:'Lilita One';font-size:18px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.3);
  background:linear-gradient(180deg,var(--blue),var(--blue2));box-shadow:0 5px 0 #0d3f8f,0 8px 12px rgba(0,0,0,.35);
  transition:transform .1s,box-shadow .1s;user-select:none;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d3f8f}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:0 5px 0 var(--gold3),0 8px 12px rgba(0,0,0,.35);color:#4a2a00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold3)}
.btn.green{background:linear-gradient(180deg,var(--green),var(--green2));box-shadow:0 5px 0 #1b6b1b,0 8px 12px rgba(0,0,0,.35)}
.btn.green:active{box-shadow:0 1px 0 #1b6b1b}
.btn.red{background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:0 5px 0 #7a1010,0 8px 12px rgba(0,0,0,.35)}
.btn.red:active{box-shadow:0 1px 0 #7a1010}
.btn.gray{background:linear-gradient(180deg,#6b7a99,#46526e);box-shadow:0 5px 0 #262d3f;color:#c7d0e6}
.btn.sm{padding:8px 14px;font-size:15px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-weight:900;font-size:12px;background:rgba(0,0,0,.3)}
.pill.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#4a2a00}

/* ---------- RANK ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{
  padding:0;overflow:hidden;cursor:pointer;transition:transform .15s;
}
.scard:active{transform:scale(.95)}
.scard .rk{
  position:absolute;top:8px;left:8px;z-index:2;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  font-family:'Lilita One';font-size:16px;background:linear-gradient(180deg,#5d78c8,#2f4a9c);box-shadow:0 3px 0 var(--border);
}
.scard .rk.r1{background:linear-gradient(180deg,#ffe36b,#ff9f1c);color:#4a2a00;text-shadow:none}
.scard .rk.r2{background:linear-gradient(180deg,#e8eefc,#9aa7c7);color:#2a3350;text-shadow:none}
.scard .rk.r3{background:linear-gradient(180deg,#e8a06b,#a65a2b)}
.scard .img{aspect-ratio:1;background:linear-gradient(160deg,#2b4fb0,#152a66);position:relative;overflow:hidden}
.scard .img img{width:100%;height:100%;object-fit:cover}
.scard .img .init{position:absolute;inset:0;display:grid;place-items:center;font-family:'Lilita One';font-size:56px;color:rgba(255,255,255,.7)}
.scard .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(10,20,54,.9))}
.scard .info{padding:10px 10px 12px}
.scard .nm{font-family:'Lilita One';font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .ar{font-size:11px;color:var(--muted);font-weight:900;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .bd{display:flex;gap:2px;font-size:14px;min-height:18px;margin-top:6px}
.scard.me{border-color:var(--gold);box-shadow:0 6px 0 var(--gold3),0 0 22px rgba(255,204,51,.35)}
.scard.me::before{content:"YOU";position:absolute;top:8px;right:8px;z-index:2;font-family:'Lilita One';font-size:11px;padding:2px 7px;border-radius:8px;background:var(--gold);color:#4a2a00}

/* ---------- ARENA ---------- */
.arena-path{display:flex;flex-direction:column;gap:14px;position:relative;padding:6px 0}
.arena{
  padding:16px;display:flex;align-items:center;gap:14px;transition:.3s;
  background:linear-gradient(135deg,var(--c1),var(--c2));border-color:rgba(255,255,255,.35);
}
.arena .em{font-size:46px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));animation:bob 3s ease-in-out infinite}
.arena h3{font-size:22px}
.arena .req{font-weight:900;font-size:13px;opacity:.9}
.arena.locked{filter:grayscale(1) brightness(.45);border-color:#2d4da3}
.arena.locked .em{animation:none}
.arena.current{transform:scale(1.03);box-shadow:0 6px 0 var(--border),0 0 30px rgba(255,204,51,.55);border-color:var(--gold)}
.arena .tag{margin-left:auto;font-family:'Lilita One';font-size:13px;padding:4px 10px;border-radius:10px;background:rgba(0,0,0,.35)}
.arena.current .tag{background:var(--gold);color:#4a2a00}
.progress{height:16px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid var(--border);margin-top:8px}
.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:width 1s cubic-bezier(.2,1,.3,1);width:0}

/* ---------- NEWS ---------- */
.news h3{font-size:20px;margin-bottom:6px;color:var(--gold)}
.news p{font-weight:600;font-size:14px;line-height:1.45;color:#dbe6ff;white-space:pre-line}
.vote{display:flex;gap:8px;margin-top:12px}
.vote .btn{flex:1;font-size:15px;padding:10px}
.vote .btn.chosen{outline:3px solid #fff;outline-offset:2px}
.vbar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin-top:10px;background:rgba(0,0,0,.35)}
.vbar i{display:block;height:100%;transition:width .6s}
.vbar .g{background:var(--green)}.vbar .n{background:var(--red)}
.vcount{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-top:4px;color:var(--muted)}

/* ---------- CHALLENGES ---------- */
.chal{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:12px}
.chal:active{transform:scale(.97)}
.chal .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(160deg,var(--purple),var(--purple2));box-shadow:0 4px 0 #4a1a8a;flex-shrink:0}
.chal h3{font-size:19px}
.chal p{color:var(--muted);font-size:13px;font-weight:700;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chal.done .ic{background:linear-gradient(160deg,var(--green),var(--green2));box-shadow:0 4px 0 #1b6b1b}
.chal .st{margin-left:auto;text-align:right;flex-shrink:0}

/* ---------- BADGES ---------- */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.badge{padding:12px 6px;text-align:center;cursor:pointer}
.badge .em{font-size:40px;display:inline-block;transition:transform .3s}
.badge.on .em{animation:spin 6s linear infinite;filter:drop-shadow(0 0 10px rgba(255,204,51,.7))}
@keyframes spin{0%,80%,100%{transform:rotateY(0)}90%{transform:rotateY(180deg)}}
.badge.off{filter:grayscale(1);opacity:.5}
.badge .nm{font-family:'Lilita One';font-size:13px;margin-top:6px;line-height:1.1}
.badge.on{border-color:var(--gold)}

/* ---------- SHOP ---------- */
.gift{text-align:center;padding:14px 10px;cursor:pointer}
.gift .em{font-size:48px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.gift .nm{font-family:'Lilita One';font-size:16px;margin:6px 0}
.gift .qty{font-size:11px;font-weight:900;color:var(--muted);margin-top:6px}
.gift.out{filter:grayscale(1);opacity:.55}
.gift.out::after{content:"SOLD OUT";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);font-family:'Lilita One';font-size:20px;color:var(--red);border:3px solid var(--red);padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.6)}

/* ---------- MODAL ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(5,10,30,.75);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s;
}
.overlay.show{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#1f3a85,#0f1e4a);border:3px solid #3a5fc4;border-bottom:none;
  transform:translateY(60px);transition:transform .35s cubic-bezier(.2,1.2,.3,1);
}
.overlay.show .modal{transform:none}
@media(min-width:600px){.overlay{align-items:center}.modal{border-radius:26px;border-bottom:3px solid #3a5fc4}}
.modal .x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:10px;background:var(--red);box-shadow:0 3px 0 #7a1010;font-family:'Lilita One';font-size:18px}
.modal{position:relative}
.detail{text-align:center}
.detail .big{width:150px;height:150px;border-radius:26px;margin:0 auto 12px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 8px 0 var(--gold3);background:var(--bg3);position:relative}
.detail .big img{width:100%;height:100%;object-fit:cover}
.detail .big .init{position:absolute;inset:0;display:grid;place-items:center;font-family:'Lilita One';font-size:70px;color:rgba(255,255,255,.7)}
.detail h2{font-size:30px}
.stats{display:flex;gap:10px;justify-content:center;margin:12px 0}
.stat{flex:1;padding:10px;border-radius:14px;background:rgba(0,0,0,.3)}
.stat b{display:block;font-family:'Lilita One';font-size:22px;color:var(--gold)}
.stat span{font-size:11px;font-weight:900;color:var(--muted)}

/* ---------- QUIZ ---------- */
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-text{font-family:'Lilita One';font-size:22px;line-height:1.25;margin-bottom:16px}
.opt{
  display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:14px;font-weight:800;font-size:15px;
  background:linear-gradient(180deg,#2c4ea8,#1d3577);box-shadow:0 4px 0 var(--border);transition:.15s;
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--border)}
.opt.right{background:linear-gradient(180deg,var(--green),var(--green2));box-shadow:0 4px 0 #1b6b1b}
.opt.wrong{background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:0 4px 0 #7a1010;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{text-align:center;padding:10px 0}
.result .em{font-size:80px;animation:bounceIn .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes bounceIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result h2{font-size:34px;color:var(--gold);margin:8px 0}
.result .earn{font-family:'Lilita One';font-size:44px;color:#fff;text-shadow:0 0 20px var(--gold)}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 500px at 50% 0%,var(--bg3),var(--bg1) 70%)}
#login .box{width:100%;max-width:380px;text-align:center}
#login .crest{width:110px;height:110px;border-radius:32px;margin:0 auto 14px;display:grid;place-items:center;font-size:60px;background:linear-gradient(160deg,var(--gold),var(--gold2));box-shadow:0 10px 0 var(--gold3),0 20px 40px rgba(0,0,0,.5);animation:bob 3s ease-in-out infinite}
#login h1{font-size:44px;color:var(--gold)}
#login p{color:var(--muted);font-weight:800;margin:6px 0 20px}
input.inp{width:100%;padding:14px;border-radius:14px;border:3px solid #3a5fc4;background:#0c1a44;color:#fff;font-family:'Nunito';font-weight:900;font-size:16px;text-align:center;outline:none;margin-bottom:12px}
input.inp:focus{border-color:var(--gold)}
.err{color:var(--red);font-weight:900;min-height:18px;font-size:13px;margin-bottom:8px}

/* ---------- MISC ---------- */
.empty{text-align:center;color:var(--muted);font-weight:800;padding:40px 10px}
.empty .em{font-size:50px;margin-bottom:8px}
#toast{position:fixed;left:50%;top:80px;transform:translate(-50%,-30px);z-index:200;padding:12px 20px;border-radius:14px;font-family:'Lilita One';font-size:17px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#4a2a00;box-shadow:0 5px 0 var(--gold3),0 10px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:linear-gradient(180deg,var(--red),var(--red2));color:#fff;box-shadow:0 5px 0 #7a1010}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.keros{color:var(--gold);font-weight:900}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <div class="crest">🪶</div>
    <h1>MARKOS</h1>
    <p>Enter your Student ID to enter the arena</p>
    <input class="inp" id="loginId" placeholder="Student ID" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="btn gold wide" onclick="doLogin()">ENTER ⚔️</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">
      <div class="crest">🪶</div>
      <div><h1>MARKOS</h1><small>ARENA</small></div>
    </div>
    <div class="mechip" id="mechip" onclick="openStudent(me.id)">
      <div class="av"><img id="meImg" alt=""></div>
      <div><div class="nm" id="meName">—</div><div class="kr"><span id="meKeros">0</span> Keros 🪶</div></div>
    </div>
  </header>

  <main>
    <!-- RANK -->
    <section class="page active" id="p-rank">
      <div class="page-title"><h2>Rank <span>Board</span></h2><span class="sub" id="rankCount"></span></div>
      <div class="grid" id="rankGrid"></div>
    </section>

    <!-- ARENA -->
    <section class="page" id="p-arena">
      <div class="page-title"><h2>Arena <span>Path</span></h2></div>
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div class="sub">CURRENT ARENA</div><h3 id="curArenaName" style="font-size:22px;color:var(--gold)">—</h3></div>
          <div class="pill gold" id="curEarned">0 🪶</div>
        </div>
        <div class="progress"><i id="arenaBar"></i></div>
        <div class="sub" id="arenaNext" style="margin-top:6px;text-align:right"></div>
      </div>
      <div class="arena-path" id="arenaPath"></div>
    </section>

    <!-- NEWS -->
    <section class="page" id="p-news">
      <div class="page-title"><h2>News <span>& Events</span></h2></div>
      <div id="newsList" style="display:flex;flex-direction:column;gap:12px"></div>
    </section>

    <!-- CHALLENGES -->
    <section class="page" id="p-chal">
      <div class="page-title"><h2>Challenges</h2><span class="sub">Earn 5 / 7 / 10 🪶</span></div>
      <div id="chalList"></div>
    </section>

    <!-- BADGES -->
    <section class="page" id="p-badges">
      <div class="page-title"><h2>Badges</h2><span class="sub" id="badgeCount"></span></div>
      <div class="bgrid" id="badgeGrid"></div>
    </section>

    <!-- SHOP -->
    <section class="page" id="p-shop">
      <div class="page-title"><h2>Gift <span>Shop</span></h2><span class="pill gold" id="shopBal">0 🪶</span></div>
      <div class="grid" id="shopGrid"></div>
    </section>
  </main>

  <nav id="nav">
    <button data-p="rank" class="on"><span class="ic">🏆</span>Rank</button>
    <button data-p="arena"><span class="ic">🏟️</span>Arena</button>
    <button data-p="news"><span class="ic">📰</span>News</button>
    <button data-p="chal"><span class="ic">⚔️</span>Challenges</button>
    <button data-p="badges"><span class="ic">🎖️</span>Badges</button>
    <button data-p="shop"><span class="ic">🎁</span>Shop</button>
  </nav>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   1. FIREBASE CONFIG  — paste your own project's config here
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCo9k2OLVQprNoCFEjEAHVInOcvS7NlUvo",
  authDomain: "abrar-100.firebaseapp.com",
  projectId: "abrar-100",
  storageBucket: "abrar-100.firebasestorage.app",
  messagingSenderId: "1031124601739",
  appId: "1:1031124601739:web:0fbbf88a38d32ffae47d8e",
  measurementId: "G-YCSYCQ6DV2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;

/* ============================================================
   2. GAME CONSTANTS (must match admin file)
   ============================================================ */
const IMG_DIR = "images/";      // images/<Student Name>.jpg
const ARENAS = [
  {name:"Training Camp",   min:0,   em:"🏕️", c1:"#5bd35b", c2:"#2f9f2f"},
  {name:"Bethlehem Stable",min:25,  em:"⭐",  c1:"#ffcc33", c2:"#c47a00"},
  {name:"Nazareth Hills",  min:50,  em:"🌄", c1:"#ff9a5b", c2:"#c2531a"},
  {name:"Galilee Shores",  min:100, em:"⛵", c1:"#3aa0ff", c2:"#1b5fc0"},
  {name:"Jordan River",    min:175, em:"🌊", c1:"#37d6d6", c2:"#127f9a"},
  {name:"Jericho Walls",   min:275, em:"🏰", c1:"#c9855a", c2:"#7a4322"},
  {name:"Mount Sinai",     min:400, em:"⛰️", c1:"#9a8cff", c2:"#5540c9"},
  {name:"Jerusalem Gates", min:550, em:"🕌", c1:"#ff6bb5", c2:"#b8237a"},
  {name:"Temple Courts",   min:750, em:"🏛️", c1:"#e6c15a", c2:"#8f6a00"},
  {name:"Heaven's Arena",  min:1000,em:"👑", c1:"#ffffff", c2:"#9fc9ff"},
];
const BADGES = [
  {id:"first_step",  em:"👣", name:"First Step",   desc:"Earned your first Keros"},
  {id:"scholar",     em:"📖", name:"Scholar",      desc:"Completed 3 challenges"},
  {id:"perfect",     em:"💯", name:"Perfect",      desc:"Got 10/10 on a challenge"},
  {id:"faithful",    em:"🕊️", name:"Faithful",     desc:"Attended 5 meetings in a row"},
  {id:"early_bird",  em:"🐦", name:"Early Bird",   desc:"Arrived early 3 times"},
  {id:"helper",      em:"🤝", name:"Helper",       desc:"Helped a friend in class"},
  {id:"memorizer",   em:"🧠", name:"Memorizer",    desc:"Memorized a whole verse"},
  {id:"singer",      em:"🎵", name:"Singer",       desc:"Led a hymn"},
  {id:"servant",     em:"🧹", name:"Servant",      desc:"Served in the church"},
  {id:"champion",    em:"🏆", name:"Champion",     desc:"Reached #1 on the board"},
  {id:"kind_heart",  em:"💛", name:"Kind Heart",   desc:"Shown kindness to others"},
  {id:"legend",      em:"🌟", name:"Legend",       desc:"Reached Heaven's Arena"},
];

/* ============================================================
   3. STATE
   ============================================================ */
let me = null, students = [], news = [], challenges = [], shop = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const imgOf = s => `<div class="init">${esc((s.name||"?")[0].toUpperCase())}</div><img src="${IMG_DIR}${encodeURIComponent(s.name)}.jpeg" alt="" onerror="this.style.display='none'" style="position:relative;z-index:1">`;
const arenaOf = earned => { let a = ARENAS[0]; for (const x of ARENAS) if (earned >= x.min) a = x; return a; };
const nextArena = earned => ARENAS.find(x => x.min > earned) || null;

function toast(msg, bad){ const t=$("toast"); t.textContent=msg; t.className=bad?"show bad":"show"; clearTimeout(t._t); t._t=setTimeout(()=>t.className="",2200); }
function confetti(){ const cs=["#ffcc33","#3aa0ff","#5bd35b","#ff5a5a","#b46bff","#fff"]; for(let i=0;i<80;i++){ const d=document.createElement("div"); d.className="confetti"; d.style.left=Math.random()*100+"vw"; d.style.background=cs[i%cs.length]; d.style.animationDuration=(1.5+Math.random()*1.5)+"s"; d.style.animationDelay=Math.random()*.4+"s"; d.style.transform=`rotate(${Math.random()*360}deg)`; document.body.appendChild(d); setTimeout(()=>d.remove(),3500);} }
function openModal(html){ $("modal").innerHTML=`<button class="x" onclick="closeModal()">✕</button>`+html; $("overlay").classList.add("show"); }
function closeModal(){ $("overlay").classList.remove("show"); }

/* ============================================================
   4. LOGIN
   ============================================================ */
async function doLogin(){
  const id = $("loginId").value.trim();
  if(!id) return;
  $("loginErr").textContent="";
  try{
    const snap = await db.collection("students").doc(id).get();
    if(!snap.exists){ $("loginErr").textContent="Student ID not found. Ask your teacher!"; return; }
    localStorage.setItem("markos_id", id);
    startApp(id);
  }catch(e){ $("loginErr").textContent="Connection error. Check Firebase config."; console.error(e); }
}
$("loginId").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
const savedId = localStorage.getItem("markos_id");
if(savedId){ $("loginId").value = savedId; doLogin(); }

/* ============================================================
   5. LIVE DATA
   ============================================================ */
function startApp(id){
  $("login").style.display="none";
  db.collection("students").onSnapshot(s=>{
    students = s.docs.map(d=>({id:d.id, ...d.data()}));
    students.forEach(x=>{ x.earned = x.earned||0; x.keros = x.keros||0; x.badges = x.badges||[]; x.done = x.done||{}; });
    students.sort((a,b)=> b.earned - a.earned || a.name.localeCompare(b.name));
    me = students.find(x=>x.id===id);
    if(!me){ localStorage.removeItem("markos_id"); location.reload(); return; }
    renderMe(); renderRank(); renderArena(); renderBadges(); renderShop(); renderChal(); renderNews();
  });
  db.collection("news").orderBy("createdAt","desc").onSnapshot(s=>{ news = s.docs.map(d=>({id:d.id, ...d.data()})); renderNews(); });
  db.collection("challenges").orderBy("createdAt","desc").onSnapshot(s=>{ challenges = s.docs.map(d=>({id:d.id, ...d.data()})); renderChal(); });
  db.collection("shop").orderBy("cost").onSnapshot(s=>{ shop = s.docs.map(d=>({id:d.id, ...d.data()})); renderShop(); });
}

/* ============================================================
   6. RENDERERS
   ============================================================ */
function renderMe(){
  $("meName").textContent = me.name;
  $("meKeros").textContent = me.keros;
  $("meImg").src = IMG_DIR+encodeURIComponent(me.name)+".jpeg";
  $("shopBal").textContent = me.keros+" 🪶";
}
function renderRank(){
  $("rankCount").textContent = students.length+" players";
  $("rankGrid").innerHTML = students.map((s,i)=>`
    <div class="card scard ${s.id===me.id?"me":""}" style="animation-delay:${Math.min(i*40,400)}ms" onclick="openStudent('${esc(s.id)}')">
      <div class="rk r${i+1}">${i+1}</div>
      <div class="img">${imgOf(s)}</div>
      <div class="info">
        <div class="nm">${esc(s.name)}</div>
        <div class="ar">${arenaOf(s.earned).em} ${esc(arenaOf(s.earned).name)}</div>
        <span class="pill gold">${s.earned} 🪶</span>
        <div class="bd">${s.badges.slice(0,5).map(b=>{const x=BADGES.find(y=>y.id===b);return x?x.em:"";}).join("")}${s.badges.length>5?`<span style="font-size:11px;color:var(--muted)">+${s.badges.length-5}</span>`:""}</div>
      </div>
    </div>`).join("");
}
function openStudent(id){
  const s = students.find(x=>x.id===id); if(!s) return;
  const rank = students.indexOf(s)+1, a = arenaOf(s.earned);
  openModal(`<div class="detail">
    <div class="big">${imgOf(s)}</div>
    <h2>${esc(s.name)}</h2>
    <div class="sub">#${rank} • ${a.em} ${esc(a.name)}</div>
    <div class="stats">
      <div class="stat"><b>${s.earned}</b><span>KEROS EARNED 🪶</span></div>
      <div class="stat"><b>${s.keros}</b><span>WALLET 🪶</span></div>
      <div class="stat"><b>${Object.keys(s.done).length}</b><span>CHALLENGES</span></div>
    </div>
    <h3 style="font-size:18px;margin:14px 0 8px;text-align:left">Badges (${s.badges.length})</h3>
    ${s.badges.length? `<div class="bgrid">${s.badges.map(b=>{const x=BADGES.find(y=>y.id===b);return x?`<div class="card badge on"><span class="em">${x.em}</span><div class="nm">${esc(x.name)}</div></div>`:"";}).join("")}</div>` : `<div class="empty">No badges yet</div>`}
  </div>`);
}
function renderArena(){
  const a = arenaOf(me.earned), n = nextArena(me.earned);
  $("curArenaName").textContent = a.em+" "+a.name;
  $("curEarned").textContent = me.earned+" 🪶";
  const pct = n ? Math.min(100, ((me.earned-a.min)/(n.min-a.min))*100) : 100;
  requestAnimationFrame(()=> $("arenaBar").style.width = pct+"%");
  $("arenaNext").textContent = n ? `${n.min-me.earned} 🪶 to ${n.name}` : "You reached the top! 👑";
  $("arenaPath").innerHTML = [...ARENAS].reverse().map((x,i)=>{
    const reached = me.earned>=x.min, cur = x===a;
    return `<div class="card arena ${reached?"":"locked"} ${cur?"current":""}" style="--c1:${x.c1};--c2:${x.c2};animation-delay:${i*50}ms">
      <div class="em">${reached?x.em:"🔒"}</div>
      <div><h3>${esc(x.name)}</h3><div class="req">${x.min} 🪶 required</div></div>
      <div class="tag">${cur?"YOU ARE HERE":reached?"UNLOCKED":"LOCKED"}</div>
    </div>`;}).join("");
}
function renderNews(){
  if(!me) return;
  if(!news.length){ $("newsList").innerHTML=`<div class="empty"><div class="em">📭</div>No news yet</div>`; return; }
  $("newsList").innerHTML = news.map((n,i)=>{
    const v = n.votes||{}, mine = v[me.id];
    const g = Object.values(v).filter(x=>x===true).length, no = Object.values(v).filter(x=>x===false).length, tot=g+no||1;
    return `<div class="card news" style="animation-delay:${i*60}ms">
      <h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>
      <div class="vote">
        <button class="btn green ${mine===true?"chosen":""}" onclick="vote('${n.id}',true)">✅ I'm going</button>
        <button class="btn red ${mine===false?"chosen":""}" onclick="vote('${n.id}',false)">❌ Not going</button>
      </div>
      <div class="vbar"><i class="g" style="width:${g/tot*100}%"></i><i class="n" style="width:${no/tot*100}%"></i></div>
      <div class="vcount"><span>${g} going</span><span>${no} not going</span></div>
    </div>`;}).join("");
}
async function vote(id, val){
  await db.collection("news").doc(id).set({votes:{[me.id]:val}},{merge:true});
  toast(val?"See you there! 🎉":"Maybe next time 🙂");
}
function renderChal(){
  if(!me) return;
  if(!challenges.length){ $("chalList").innerHTML=`<div class="empty"><div class="em">⚔️</div>No challenges yet</div>`; return; }
  $("chalList").innerHTML = challenges.map((c,i)=>{
    const done = me.done[c.id];
    return `<div class="card chal ${done?"done":""}" style="animation-delay:${i*60}ms" onclick="startChallenge('${c.id}')">
      <div class="ic">${done?"✅":"⚔️"}</div>
      <div style="min-width:0"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p></div>
      <div class="st">${done?`<span class="pill gold">+${done} 🪶</span>`:`<span class="pill">${(c.questions||[]).length} Q</span>`}</div>
    </div>`;}).join("");
}
function renderBadges(){
  const mine = new Set(me.badges);
  $("badgeCount").textContent = `${mine.size} / ${BADGES.length}`;
  $("badgeGrid").innerHTML = BADGES.map((b,i)=>`<div class="card badge ${mine.has(b.id)?"on":"off"}" style="animation-delay:${i*40}ms" onclick="toast('${esc(b.name)}: ${esc(b.desc)}')">
    <span class="em">${b.em}</span><div class="nm">${esc(b.name)}</div></div>`).join("");
}
function renderShop(){
  if(!me) return;
  if(!shop.length){ $("shopGrid").innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="em">🎁</div>Shop is empty</div>`; return; }
  $("shopGrid").innerHTML = shop.map((g,i)=>`<div class="card gift ${g.qty<=0?"out":""}" style="animation-delay:${i*50}ms" onclick="buy('${g.id}')">
    <div class="em">${esc(g.emoji||"🎁")}</div><div class="nm">${esc(g.name)}</div>
    <span class="pill gold">${g.cost} 🪶</span>
    <div class="qty">${g.qty} left</div></div>`).join("");
}

/* ============================================================
   7. QUIZ ENGINE
   ============================================================ */
let quiz = null;
function startChallenge(id){
  const c = challenges.find(x=>x.id===id); if(!c) return;
  if(me.done[c.id]){ toast(`Already completed: +${me.done[c.id]} 🪶`); return; }
  const qs = c.questions||[];
  if(!qs.length){ toast("This challenge has no questions yet",true); return; }
  quiz = {c, i:0, correct:0, locked:false};
  openModal(`<h2 style="font-size:24px;color:var(--gold)">${esc(c.title)}</h2><p class="sub" style="margin:6px 0 16px">${esc(c.desc)}</p>
    <div class="card" style="margin-bottom:14px;text-align:center"><div class="sub">REWARDS</div>
      <div style="display:flex;justify-content:space-around;margin-top:8px;font-family:'Lilita One';font-size:16px">
        <span>&lt;60% → 5 🪶</span><span>60%+ → 7 🪶</span><span>90%+ → 10 🪶</span></div></div>
    <button class="btn gold wide" onclick="showQ()">START ⚔️</button>`);
}
function showQ(){
  const q = quiz.c.questions[quiz.i]; quiz.locked=false;
  openModal(`<div class="q-top"><span class="pill">Question ${quiz.i+1} / ${quiz.c.questions.length}</span><span class="pill gold">${quiz.correct} ✓</span></div>
    <div class="q-text">${esc(q.q)}</div>
    ${q.options.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}`);
}
function answer(i){
  if(quiz.locked) return; quiz.locked=true;
  const q = quiz.c.questions[quiz.i];
  if(i===q.answer){ quiz.correct++; $("opt"+i).classList.add("right"); }
  else { $("opt"+i).classList.add("wrong"); $("opt"+q.answer).classList.add("right"); }
  setTimeout(()=>{ quiz.i++; if(quiz.i<quiz.c.questions.length) showQ(); else finishQuiz(); }, 900);
}
async function finishQuiz(){
  const n = quiz.c.questions.length, pct = quiz.correct/n*100;
  const pts = pct>=90?10 : pct>=60?7 : 5;
  const ref = db.collection("students").doc(me.id);
  try{
    await db.runTransaction(async t=>{
      const s = await t.get(ref); const d = s.data();
      if((d.done||{})[quiz.c.id]) throw new Error("done");
      t.update(ref,{ keros:(d.keros||0)+pts, earned:(d.earned||0)+pts, [`done.${quiz.c.id}`]:pts });
    });
    confetti();
    openModal(`<div class="result"><div class="em">${pct>=90?"🏆":pct>=60?"🎉":"💪"}</div>
      <h2>${pct>=90?"PERFECT!":pct>=60?"GREAT JOB!":"NICE TRY!"}</h2>
      <div class="sub">${quiz.correct} / ${n} correct</div>
      <div class="earn">+${pts} 🪶</div>
      <button class="btn gold wide" style="margin-top:16px" onclick="closeModal()">COLLECT</button></div>`);
  }catch(e){ toast("Already completed!",true); closeModal(); }
}

/* ============================================================
   8. SHOP
   ============================================================ */
function buy(id){
  const g = shop.find(x=>x.id===id); if(!g||g.qty<=0) return;
  if(me.keros<g.cost){ toast(`Need ${g.cost-me.keros} more Keros 🪶`,true); return; }
  openModal(`<div class="result"><div class="em" style="animation:none">${esc(g.emoji||"🎁")}</div>
    <h2 style="font-size:26px">${esc(g.name)}</h2>
    <p class="sub">Buy for <span class="keros">${g.cost} 🪶</span>? You have ${me.keros} 🪶</p>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn gray" style="flex:1" onclick="closeModal()">Cancel</button>
    <button class="btn gold" style="flex:1" onclick="confirmBuy('${g.id}')">BUY 🛒</button></div></div>`);
}
async function confirmBuy(id){
  const sref = db.collection("students").doc(me.id), gref = db.collection("shop").doc(id);
  try{
    await db.runTransaction(async t=>{
      const [s,g] = await Promise.all([t.get(sref),t.get(gref)]);
      const sd=s.data(), gd=g.data();
      if(gd.qty<=0) throw new Error("Sold out!");
      if((sd.keros||0)<gd.cost) throw new Error("Not enough Keros!");
      t.update(sref,{keros:sd.keros-gd.cost, purchases:FV.arrayUnion({item:gd.name, cost:gd.cost, at:Date.now()})});
      t.update(gref,{qty:gd.qty-1});
    });
    confetti(); closeModal(); toast("Purchased! Ask your teacher for it 🎁");
  }catch(e){ toast(e.message||"Failed",true); closeModal(); }
}

/* ============================================================
   9. NAV
   ============================================================ */
$("nav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id==="p-"+b.dataset.p));
  if(b.dataset.p==="arena") renderArena();
});
</script>
</body>
</html>
